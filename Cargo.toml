[package]
name = "pingenty"
version = "0.1.0"
edition = "2021"
description = "Monitor de rede assíncrono com TUI em Rust"
license = "MIT"
repository = "https://github.com/tiagouzl/pingenty"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.36", features = ["full"] }
ratatui = "0.26"
crossterm = { version = "0.27", features = ["event-stream"] }
hickory-resolver = "0.24"
pnet = "0.34"
socket2 = { version = "0.5", features = ["all"] }
anyhow = "1.0"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
tokio = { version = "1.36", features = ["full"] }

[[bench]]
name = "flows"
harness = false
